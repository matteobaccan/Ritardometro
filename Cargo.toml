[package]
name = "ritardometro"
version = "1.0.0"
edition = "2021"
description = "Always-on-top speaker pacing timer: tracks your current slide via screen OCR, tells you if you're ahead or behind, with an animated avatar cheering you on"
license = "MIT"
repository = "https://github.com/matteobaccan/Ritardometro"
readme = "README.md"

[dependencies]
# Renderer glow (OpenGL): è il più affidabile per le finestre trasparenti su Windows
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
serde = { version = "1", features = ["derive"] }
toml = "1.0"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# Cattura schermo + OCR servono solo su Windows (Windows.Media.Ocr)
[target.'cfg(windows)'.dependencies]
xcap = "0.9"
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

# Su macOS la finestra deve dichiarare ad AppKit di poter comparire sopra le app
# a schermo intero: eframe e winit non espongono `collectionBehavior`/`level`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
