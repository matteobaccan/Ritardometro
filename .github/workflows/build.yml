name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Prepara pacchetto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ritardometro.exe dist/
          Copy-Item ritardometro.toml dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ritardometro-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ritardometro-windows
          path: dist/

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ritardometro-windows.zip
          generate_release_notes: true
