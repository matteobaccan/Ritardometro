name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (X11/Wayland/OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Test
        run: cargo test

      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ritardometro-${{ runner.os }}
          path: |
            target/release/ritardometro
            target/release/ritardometro.exe
          if-no-files-found: ignore
